# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - run: npm ci
    # Type-check before the expensive browser install: this gate is what catches
    # v1 API removals and options-bag typos (e.g. moveBy durationMs) that the
    # bundler would otherwise transpile away silently.
    - name: Type check
      run: npm run typecheck
    - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:ci